specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AletheiaVerifier
    network: sepolia
    source:
      address: "0x110BB3af042ecbeA118d399e300a4358DC9b993c"
      abi: AletheiaVerifier
      startBlock: 11674698
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ClaimVerified
        - ClaimVerifierSet
        - OwnershipTransferStarted
        - OwnershipTransferred
      abis:
        - name: AletheiaVerifier
          file: ./abis/AletheiaVerifier.json
      eventHandlers:
        - event: ClaimVerified(indexed bytes32,indexed address,indexed uint8,bytes32,uint256,uint32,bytes32,bytes32,bytes32,uint64)
          handler: handleClaimVerified
        - event: ClaimVerifierSet(indexed uint8,indexed address)
          handler: handleClaimVerifierSet
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/aletheia-verifier.ts
