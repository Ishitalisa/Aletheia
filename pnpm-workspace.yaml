packages:
  - packages/*

# Install scripts run arbitrary code, so each one is allowed deliberately.
allowBuilds:
  # circomlibjs falls back to a JavaScript implementation for the paths Aletheia uses
  # (Poseidon and EdDSA), so this native build is not needed.
  blake-hash: false
  # Fetches its own platform binary; Hardhat cannot run without it.
  esbuild: true
